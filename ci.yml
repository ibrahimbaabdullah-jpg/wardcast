name: WardCast checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check Python source and tests
        run: python -m ruff check src tests
      - name: Run Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Install and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser workflow against bundled forecasts
        run: |
          mkdir -p work
          wardcast serve --host 127.0.0.1 --port 8000 > work/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5) as response:
                      assert response.status == 200
                  break
              except (OSError, urllib.error.URLError):
                  time.sleep(0.5)
          else:
              raise SystemExit('Bundled API failed readiness; inspect work/api.log')
          PY
          pnpm --dir frontend test:e2e
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            work/api.log
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build demo image
        run: docker build --tag wardcast:ci .
      - name: Smoke test container and static frontend
        run: |
          docker run --detach --name wardcast-ci --publish 127.0.0.1:8000:8000 wardcast:ci
          trap 'docker logs wardcast-ci; docker rm --force wardcast-ci' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/api/sources > /dev/null
          curl --fail http://127.0.0.1:8000/ | grep -q '<div id="root">'
